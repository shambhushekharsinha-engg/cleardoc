name: ClearDoc CI

'on':
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Frontend Linting, Unit Tests, and Build Verification
  # -------------------------------------------------------------
  frontend:
    name: Frontend (Lint, Test, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cleardoc-ui/package-lock.json

      - name: Install frontend dependencies
        run: cd cleardoc-ui && npm ci

      - name: Lint frontend code
        run: cd cleardoc-ui && npm run lint

      - name: Run frontend unit tests
        run: cd cleardoc-ui && npm test

      - name: Build frontend production bundle
        run: cd cleardoc-ui && npm run build

  # -------------------------------------------------------------
  # Job 2: Backend Python Unit Tests and Static Code Analysis
  # -------------------------------------------------------------
  backend:
    name: Backend (Python 3.13, Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: cleardoc-api/hello_world/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cleardoc-api/hello_world/requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: Run backend tests
        run: cd cleardoc-api/hello_world && pytest --verbose

  # -------------------------------------------------------------
  # Job 3: AWS SAM CloudFormation Template Validation
  # -------------------------------------------------------------
  sam-validate:
    name: AWS SAM Template Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Validate SAM template
        run: cd cleardoc-api && sam validate --lint
